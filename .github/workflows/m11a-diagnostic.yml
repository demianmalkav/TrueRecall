name: m11a-diagnostic

on:
  push:
    branches: [m09c-native-sequence-seam]
    paths:
      - 'tools/build/scene_palette.py'
      - 'tools/build/scene_source_v2.py'
      - 'tools/build/scene_compiler_v2.py'
      - 'tools/rom_probe/scene_palette_probe.py'
      - 'tools/rom_probe/scene_source_v2_transaction_probe.py'
      - 'tests/test_scene_palette_static.py'
      - 'tests/test_scene_source_v2_static.py'
      - 'tests/test_scene_compiler_v2_static.py'
      - '.github/workflows/m11a-diagnostic.yml'
  workflow_dispatch:

jobs:
  m11a-static-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Run full static diagnostic and retain output
        id: diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            echo '=== PY_COMPILE ==='
            python -m py_compile \
              tools/build/m09c_native_phase_pixel_sequence.py \
              tools/build/m09d_mapping_constrained_sprite_compiler.py \
              tools/build/m09d_quaid_sprint_source.py \
              tools/build/m09d_quaid_sprint_build.py \
              tools/build/m100a_vertical_slice_baseline.py \
              tools/build/scene_palette.py \
              tools/build/scene_source_v2.py \
              tools/build/scene_compiler_v2.py \
              tools/rom_probe/m09c_native_sequence_seam_probe.py \
              tools/rom_probe/m09c_visual_avatar_roundtrip_probe.py \
              tools/rom_probe/m09c_canonical_gate.py \
              tools/rom_probe/m09c_animation_progression_analysis.py \
              tools/rom_probe/m09c_phase_bridge_analysis.py \
              tools/rom_probe/m09d_quaid_sprint_contract_probe.py \
              tools/rom_probe/scene_palette_probe.py \
              tools/rom_probe/scene_source_v2_transaction_probe.py \
              tools/rom_probe/sprite_sequence_roundtrip_probe.py \
              tools/runtime/m09c_animation_state_trace.py \
              tools/runtime/m09c_animation_state_trace_v2.py \
              tools/runtime/m09d_quaid_runtime_regression.py \
              tools/runtime/m100b_vertical_slice_runtime.py \
              tools/recovery_doctor.py
            compile_status=$?
            echo "compile_status=$compile_status"
            echo '=== FULL UNITTEST ==='
            python -m unittest -v \
              tests.test_m09c_native_sequence_seam_static \
              tests.test_m09c_visual_roundtrip_static \
              tests.test_m09c_canonical_gate_static \
              tests.test_m09c_animation_state_trace_static \
              tests.test_m09c_animation_state_trace_v2_static \
              tests.test_m09c_animation_progression_analysis_static \
              tests.test_m09c_phase_bridge_analysis_static \
              tests.test_m09c_native_phase_pixel_sequence_static \
              tests.test_m09d_mapping_constrained_sprite_compiler \
              tests.test_m09d_quaid_sprint_source \
              tests.test_m09d_quaid_sprint_build_static \
              tests.test_m100a_vertical_slice_baseline_static \
              tests.test_m100b_vertical_slice_runtime_static \
              tests.test_scene_palette_static \
              tests.test_scene_source_v2_static \
              tests.test_scene_compiler_v2_static \
              tests.test_recovery_doctor_static
            test_status=$?
            echo "test_status=$test_status"
            echo '=== RECOVERY DOCTOR ==='
            python tools/recovery_doctor.py
            doctor_status=$?
            echo "doctor_status=$doctor_status"
            if [ "$compile_status" -ne 0 ] || [ "$test_status" -ne 0 ] || [ "$doctor_status" -ne 0 ]; then
              exit 1
            fi
          } > m11a-diagnostic.log 2>&1
      - name: Publish diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m11a-diagnostic-${{ github.sha }}
          path: m11a-diagnostic.log
          if-no-files-found: error
          retention-days: 3
      - name: Preserve diagnostic failure
        if: steps.diagnostic.outcome == 'failure'
        run: exit 1
