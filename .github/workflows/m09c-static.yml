name: m09c-static

on:
  push:
    branches: [m09c-native-sequence-seam]
    paths:
      - 'tools/rom_probe/m09c_*'
      - 'tools/rom_probe/sprite_sequence_roundtrip_probe.py'
      - 'tests/test_m09c_native_sequence_seam_static.py'
      - '.github/workflows/m09c-static.yml'
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Compile M09C probes
        run: |
          python -m py_compile \
            tools/rom_probe/m09c_native_sequence_seam_probe.py \
            tools/rom_probe/m09c_visual_avatar_roundtrip_probe.py \
            tools/rom_probe/sprite_sequence_roundtrip_probe.py
      - name: Run seam helper tests
        run: python -m unittest -v tests.test_m09c_native_sequence_seam_static
