name: m09c-static

on:
  push:
    branches: [m09c-native-sequence-seam]
    paths:
      - 'tools/rom_probe/m09c_*'
      - 'tools/rom_probe/sprite_sequence_roundtrip_probe.py'
      - 'tools/runtime/m09c_*'
      - 'tests/test_m09c_*'
      - '.github/workflows/m09c-static.yml'
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Compile M09C probes and runtime tracer
        run: |
          python -m py_compile \
            tools/rom_probe/m09c_native_sequence_seam_probe.py \
            tools/rom_probe/m09c_visual_avatar_roundtrip_probe.py \
            tools/rom_probe/m09c_canonical_gate.py \
            tools/rom_probe/m09c_animation_progression_analysis.py \
            tools/rom_probe/sprite_sequence_roundtrip_probe.py \
            tools/runtime/m09c_animation_state_trace.py
      - name: Run M09C static tests
        run: |
          python -m unittest -v \
            tests.test_m09c_native_sequence_seam_static \
            tests.test_m09c_visual_roundtrip_static \
            tests.test_m09c_canonical_gate_static \
            tests.test_m09c_animation_state_trace_static \
            tests.test_m09c_animation_progression_analysis_static

  blastem-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install BlastEm runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libpulse0 \
            libsamplerate0 \
            libasound2t64 \
            libdecor-0-0
      - name: Download verified BlastEm
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/ulalume/blastem/releases/download/build-6e5677969b59/blastem-linux-x86_64-1.0.0-6e5677969b59.tar.gz'
          curl -L --fail --retry 3 "$url" -o blastem.tar.gz
          echo 'd81020d16e8cebb8c1946c0f36a6205c1ce7c5a682a1db922d973187418431df  blastem.tar.gz' | sha256sum -c -
          mkdir blastem
          tar -xzf blastem.tar.gz -C blastem
          chmod +x blastem/blastem-linux-x86_64-1.0.0-6e5677969b59/blastem
          ldd blastem/blastem-linux-x86_64-1.0.0-6e5677969b59/blastem | tee blastem-ldd.txt
          ! grep -q 'not found' blastem-ldd.txt
      - name: Run debugger/control-socket integration test
        env:
          BLASTEM_BIN: ${{ github.workspace }}/blastem/blastem-linux-x86_64-1.0.0-6e5677969b59/blastem
        run: python -m unittest -v tests.test_m09c_blastem_debugger_integration
